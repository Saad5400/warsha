# Local dev dependencies for the Warsha collab/sync server.
#   docker compose up -d
# Postgres for Drizzle, MinIO as an S3-compatible store, and a one-shot job that
# creates the bucket so PUT/GET work out of the box.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warsha
      POSTGRES_PASSWORD: warsha
      POSTGRES_DB: warsha
    ports:
      - '5432:5432'
    volumes:
      - warsha_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warsha -d warsha']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - warsha_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is healthy, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warsha-docs &&
      echo 'bucket warsha-docs ready'
      "

volumes:
  warsha_pg:
  warsha_minio:
