<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" role="img" aria-labelledby="warsha-logo-title">
  <title id="warsha-logo-title">Warsha</title>
  <!-- The mark, plate-less, for surfaces we already control (top bar, welcome
       panel, README). The plated version every OS icon is derived from is
       mark.svg; DESIGN-SPEC §11 says what the figure means and which candidates
       it beat.

       A vise: two bracket-shaped jaws holding a workpiece. Inline the file to
       recolour it via the two custom properties below; the fallbacks make it
       correct as a plain <img> on a dark background.

       The two tones are not decorative. Jaws and workpiece in one colour close
       the gap between them and the mark becomes a single blob below 24px —
       verified on a contact sheet, not assumed. Keep the contrast. -->
  <path d="M8.8 5.6h-3a1.15 1.15 0 0 0-1.15 1.15v10.5a1.15 1.15 0 0 0 1.15 1.15h3"
        stroke="var(--logo-ink, #E8EBF0)" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15.2 5.6h3a1.15 1.15 0 0 1 1.15 1.15v10.5a1.15 1.15 0 0 1-1.15 1.15h-3"
        stroke="var(--logo-ink, #E8EBF0)" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="9.4" y="8.6" width="5.25" height="6.75" rx="1.5"
        fill="var(--logo-accent, #F2A94B)"/>
</svg>
