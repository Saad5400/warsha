<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 32" width="116" height="32"
     fill="none" role="img" aria-labelledby="warsha-lockup-title">
  <title id="warsha-lockup-title">Warsha</title>
  <!-- Docs/README lockup: symbol + wordmark. In the app, build the lockup in
       HTML instead (logo.svg plus a styled span) so the wordmark stays real,
       selectable text rather than a traced path.
       See DESIGN-SPEC §7.7 and §11.

       Brand v3: same clean-silhouette geometry as logo.svg (a scaled copy —
       keep both in sync), one colour, no amber. -->
  <g transform="translate(0 4)">
    <path d="M6.75 4.275 3.15 4.275 3.15 19.725 6.75 19.725"
          stroke="var(--logo-ink, #FAFAFA)" stroke-width="3.3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17.25 4.275 20.85 4.275 20.85 19.725 17.25 19.725"
          stroke="var(--logo-ink, #FAFAFA)" stroke-width="3.3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9.6" y="7.65" width="4.8" height="8.7" rx="2.4"
          fill="var(--logo-ink, #FAFAFA)"/>
  </g>
  <text x="32" y="21.5"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17.5" font-weight="600" letter-spacing="-0.2"
        fill="var(--logo-ink, #FAFAFA)">Warsha</text>
</svg>
