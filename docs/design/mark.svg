<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none"
     role="img" aria-labelledby="warsha-mark-title">
  <title id="warsha-mark-title">Warsha</title>
  <!-- THE WARSHA MARK. Canonical source for every icon artifact.
       Regenerate them with:  node tools/brand/build-brand-assets.mjs

       WHAT IT IS: a vise. Two jaws clamp a workpiece to a bench — and the jaws
       are square brackets, so the same figure reads as code held open for work.
       "Warsha" (ورشة) means workshop; this is the workshop's defining object
       fused with the thing the student actually puts in it. The workpiece
       carries the accent token, the colour the interface already uses to mean
       "this one is live": the active tab's rule, the caret, the Run control.

       NOTE FOR EDITORS: no comment in this file may contain two consecutive
       hyphens. That is illegal in XML, and while an inlined SVG survives it via
       the lenient HTML parser, this file also ships as app/public/favicon.svg,
       which the browser parses strictly. A CSS token name written out in full
       here is a favicon that silently fails to load, so name tokens in prose.
       tools/brand/build-brand-assets.mjs fails the build if this slips.

       WHY NOT A LETTER: a "W" on a tile is a monogram, which says nothing about
       what Warsha does and is the standard tell that nobody did this work. This
       mark was chosen off two contact sheets of six candidates each, judged at
       96/64/48/32/24/16px against a circular mask and both background polarities.
       What died, and why, is worth knowing before proposing a replacement:
         - a play triangle over the rule — perfectly legible, but it is the
           YouTube glyph; an icon indistinguishable from a stock one is not one
         - a hammer over the rule — collapses into a "T", i.e. back to a letter
         - an anvil — the strongest *concept*, but the horn and waist dissolve
           below 32px and it becomes a bowtie
         - a trestle bench — reads as a picnic table, and says nothing about code
         - the jaws and workpiece both in amber — the gap closes and the whole
           mark becomes one blob at 24px. The two-tone contrast is load-bearing.

       GEOMETRY IS SHARED with app/public/favicon.svg and (once it is switched
       over) the inline logo component. If you change a path here, change it
       there; tools/brand/build-brand-assets.mjs re-emits the raster artifacts
       but cannot reach into a JSX file. -->
  <rect id="tile" width="64" height="64" rx="14" fill="#15171C"/>
  <g id="glyph">
    <path d="M23.5 15h-8a3 3 0 0 0-3 3v28a3 3 0 0 0 3 3h8"
          stroke="#E8EBF0" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40.5 15h8a3 3 0 0 1 3 3v28a3 3 0 0 1-3 3h-8"
          stroke="#E8EBF0" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="25" y="23" width="14" height="18" rx="4" fill="#F2A94B"/>
  </g>
</svg>
