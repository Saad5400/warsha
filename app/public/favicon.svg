<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <title>Warsha</title>
  <!-- Favicon variant of docs/design/logo.svg, per DESIGN-SPEC §11: at 16px the
       amber rule is a smudge and the W loses definition sharing the box, so the
       mark-only variant drops the rule and scales the W to fill instead.
       A tab favicon is composited on the browser's own chrome, not on our
       surface, so the ink is the amber — a white W vanishes on a light-themed
       tab strip, which §11 calls out as an outright failure. -->
  <path d="M2.5 5 L8.6 17.5 L12 10.6 L15.4 17.5 L21.5 5"
        stroke="#F2A94B" stroke-width="3.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
