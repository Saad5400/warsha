<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none"
     role="img" aria-labelledby="warsha-mark-title">
  <title id="warsha-mark-title">Warsha</title>
  <!-- THE WARSHA MARK — brand v3, the clean silhouette tier. Canonical
       source for the SMALL icon artifacts only. Regenerate with:
         node tools/brand/build-brand-assets.mjs

       BRAND V3 SPLIT: the founder's actual mark is a glitched raster
       (docs/design/brand-v3/mark-glitch-dark.png / mark-glitch-transparent.png)
       — scan-line noise over two thick rounded bracket jaws holding a
       centred pill. That texture only reads at size: fine below ~180px, it
       thins into noise. So there are now two tiers, both generated by
       tools/brand/build-brand-assets.mjs:
         - 180px and up (apple-touch-icon, icon-192, icon-512,
           icon-maskable-512): the actual glitch PNG, composited onto a
           full-bleed square tile. THIS FILE is not used for those.
         - under 180px (favicon.svg, the favicon.ico frames at 16/32/48):
           THIS FILE — a clean, unglitched redraw of the same two-jaws/pill
           structure, proportioned from pixel measurements of
           mark-glitch-transparent.png. See docs/design/logo.svg for the
           plate-less 24-grid version this one scales up 64/24×; keep both
           in sync if the geometry ever moves.

       WHAT IT IS (unchanged from v1/v2): a vise. Two jaws clamp a workpiece
       to a bench, and the jaws are square brackets, so the same figure reads
       as code held open for work. "Warsha" means workshop. Brand v3 killed
       the amber workpiece the founder had signed off on earlier — no amber
       anywhere now, jaws and workpiece are the same near-white ink.

       NOTE FOR EDITORS: no comment in this file may contain two consecutive
       hyphens. That is illegal in XML, and while an inlined SVG survives it
       via the lenient HTML parser, this file also ships as
       app/public/favicon.svg, which the browser parses strictly. A CSS
       token name written out in full here is a favicon that silently fails
       to load, so name tokens in prose. tools/brand/build-brand-assets.mjs
       fails the build if this slips.

       TILE COLOUR is the surface-0 token from docs/design/tokens.css (theme
       v3, task #27): #09090B. Kept in sync by hand in three more places —
       app/index.html (html/#boot background and the theme-color meta) and
       app/public/manifest.webmanifest (background_color/theme_color) — none
       of which can read a CSS custom property at the point they need it.
       All four must agree or the boot frame seams. -->
  <rect id="tile" width="64" height="64" rx="14" fill="#09090B"/>
  <g id="glyph">
    <path d="M18 11.4 8.4 11.4 8.4 52.6 18 52.6"
          stroke="#FAFAFA" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 11.4 55.6 11.4 55.6 52.6 46 52.6"
          stroke="#FAFAFA" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="25.6" y="20.4" width="12.8" height="23.2" rx="6.4" fill="#FAFAFA"/>
  </g>
</svg>
