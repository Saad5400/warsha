# nginx config for the built Warsha SPA (see /Dockerfile).

# How long a browser may reuse each file without asking — the ONE place that is
# decided. This file is included at http scope (conf.d/), so a map may live here.
#
# Only /assets/ is content-hashed (Vite names every file it emits there after
# its bytes), so only /assets/ can be immutable: a new build never reuses a name
# with new content. Everything else keeps its name across deploys — index.html
# and the per-locale/tutorial pages, coi-serviceworker.js, and the runtime files
# `npm run assets` stages unhashed in public/ (warsha-jvm.worker.js, ecj.jar,
# warsha-boot.jar, warsha-dotnet/**, warsha-esbuild.wasm, the framework JSON…).
# Those get `no-cache`: keep a copy, but revalidate it (a cheap 304 via ETag)
# before every use.
#
# This was a live bug. With no Cache-Control at all, browsers apply HEURISTIC
# freshness — 10% of the time since Last-Modified — so a student whose last
# visit was ten days into a build was handed that build's index.html and
# workers from the HTTP cache for up to a day after the next deploy, without a
# request reaching us. The old document kept running the old build, and the
# old workers were copied into the NEW build's service-worker cache, where they
# met the new bundle on every later visit until the next deploy — the "only
# clearing the cache fixes it" failure. tools/qa/deploy-upgrade-check.mjs
# reproduces both against this file.
#
# Keyed on the status too: only a file that was actually found is immutable. A
# 404 for a hashed name (an old page asking for a deleted chunk) must not be
# pinned for a year — a rollback deploy brings that exact name back.
map "$status:$uri" $warsha_cache_control {
    ~^(200|206|304):/assets/  "public, max-age=31536000, immutable";
    default                   "no-cache";
}

# Content-Security-Policy, on HTML documents only ($uri is /…/index.html after
# the index module or the SPA fallback has run). Defence in depth: the bugs it
# backs up are fixed where they live (a `javascript:` link in rendered notebook
# Markdown was one).
#
# Documents only, on purpose. A worker or the service worker takes its policy
# from its OWN response, and this one would wreck them: the service worker
# fetch()es every request the page makes — a student's preview loading an image
# from any host included — so any connect-src at all would break it, and
# CheerpJ compiles Java to JS with eval in its worker.
#
# Two headers, because one policy cannot be both strict and safe here. The Web
# preview is a sandboxed `srcdoc` iframe, and a srcdoc document INHERITS its
# parent's policy. Student projects are inline <script>s, inline handlers,
# <script src="https://any-cdn">, fetch() to any API, forms posting anywhere —
# all legitimate, all of which a strict script-src/connect-src/form-action would
# break. So:
#
#   ENFORCED — only what no Warsha page or student project needs:
#     object-src 'none'       no <object>/<embed> plugin content
#     base-uri 'self'         an injected <base> cannot re-point relative URLs
#     frame-ancestors 'self'  no clickjacking by framing Warsha elsewhere
#
#   REPORT-ONLY — the strict policy for Warsha's own pages, which they meet
#   with zero violations (verified with every engine, offline, the Web preview
#   with React/Vue/Svelte + Tailwind, and the collab + analytics origins). Its
#   reports are the preview's student code, by design. Enforcing it needs the
#   preview moved to its own origin first, so it stops inheriting this policy.
#     script-src  self + wasm-unsafe-eval (the engines' wasm) + the two inline
#                 <head>/<body> scripts by hash + Umami, and 'unsafe-eval':
#                 the Vue SFC compiler (Web preview builds) and web-tree-sitter's
#                 Emscripten glue (the editor's parser) both build functions
#                 from strings in the page itself. That does NOT reopen
#                 `javascript:` URLs or inline handlers — those are governed by
#                 'unsafe-inline', which stays out. The hashes are checked
#                 against the built index.html on every build (warsha:csp-hashes
#                 in vite.config.ts), so an edited inline script fails the
#                 build instead of silently falling out of the policy.
#     connect-src self + the runtime CDNs (Wasmer spawns blob: workers, which
#                 inherit this policy) + Umami + the collab API over https/wss.
#     worker-src  self, blob: and data: workers (the JS runner, Wasmer).
#     style-src   'unsafe-inline': React style props and CodeMirror's injected
#                 <style> sheets. Styles cannot run script.
map $uri $warsha_csp {
    ~\.html$  "object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
    default   "";
}
map $uri $warsha_csp_report_only {
    ~\.html$  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'sha256-HQdYEmD03ofoOIUyzrfXGpJF3GhglPfxL187PH6cKcI=' 'sha256-cAQFFaygepaMUe3dEzBPoyHPIDuZ3XsWErG28D/ZIxY=' https://analytics.sb.sa blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://analytics.sb.sa https://warsha-api.sb.sa wss://warsha-api.sb.sa https://cdn.jsdelivr.net https://cjrtnc.leaningtech.com https://unpkg.com https://registry.wasmer.io https://cdn.wasmer.io; worker-src 'self' blob: data:; frame-src 'self' blob: data:; media-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default   "";
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Cross-origin isolation for SharedArrayBuffer, which the in-browser
    # runtimes need. The app also ships coi-serviceworker.js as a fallback for
    # hosts that can't set these. When the server sets them (here), that SW no
    # longer needs to inject headers, but it still registers and runs its
    # offline caching layer, so the installed PWA works with no network.
    add_header Cross-Origin-Opener-Policy   same-origin   always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    # Set here, at server level, and NOWHERE below: an `add_header` inside a
    # location silently drops every server-level one for that location — COOP and
    # COEP included, which would take SharedArrayBuffer (and every engine) with
    # them. The per-file choice is the map above, not a per-location header.
    add_header Cache-Control $warsha_cache_control always;
    # Empty for anything but a document, which nginx sends as no header at all.
    add_header Content-Security-Policy             $warsha_csp             always;
    add_header Content-Security-Policy-Report-Only $warsha_csp_report_only always;

    # nginx's default mime.types (included at http scope) already maps
    # application/wasm; don't add a `types` block here — it would replace the
    # whole map and mis-serve html/css/js as octet-stream.

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length   1024;

    # nginx's default mime.types has no `.webmanifest` entry — checked against
    # upstream conf/mime.types, it is genuinely absent — so without this the
    # manifest goes out as application/octet-stream. Chrome parses it anyway
    # (the spec says process it as JSON whatever the type says), which is why
    # install still worked, but Safari is stricter about the Add to Home Screen
    # metadata and Lighthouse reports it.
    #
    # `default_type` in an exact-match location, NOT a `types` block: a `types`
    # block here would replace the inherited map wholesale and mis-serve
    # html/css/js/wasm as octet-stream — the same trap the note above describes.
    # An exact `location =` also outranks the SPA catch-all below, so this file
    # never falls through to index.html.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Both files are emitted into dist/ by the warsha:site-origin plugin in
    # vite.config.ts, so `try_files $uri` below would already find them. These
    # exact-match locations exist to make their ABSENCE loud.
    #
    # This was a real, live bug: with neither file on disk, the SPA catch-all
    # answered /robots.txt and /sitemap.xml with `200 text/html` — a crawler
    # asking for robots got the React shell, and Search Console reported the
    # sitemap as unparseable rather than as missing. A 404 is the honest answer
    # to "this build did not produce a sitemap"; an index.html is a lie that
    # takes a curl to notice.
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }

    # A request for a FILE that is not on disk is a 404, never the SPA shell.
    # The app's routes (/, /en/, /p/<id>, /tutorials/<slug>/) have no extension,
    # so only they need the fallback below. Answering `/assets/index-OLD.js` with
    # `200 text/html` — what the catch-all did — is worse than useless after a
    # deploy: the browser reports a MIME error instead of a missing file, and the
    # offline service worker, seeing a 200, cached that HTML under the script's
    # URL. Exact-match locations above (manifest, robots, sitemap) still outrank
    # this regex.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html (base is '/', single entry).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
