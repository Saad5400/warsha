<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIRST PAINT. These four lines come before the service-worker script on
         purpose, and the order is load-bearing.
         coi-serviceworker is a synchronous, parser-blocking script, so anything
         after it is not parsed until it has been fetched and executed — which is
         long enough for Chrome to composite one white frame. Measured on a real
         first visit (CDP screencast, fresh profile, 390x844): with the style tag
         placed after the script, frame 1 at 18ms was still rgb(255,255,255).
         `color-scheme: dark` is the part that actually fixes it: it tells the UA
         to paint its own default canvas dark before any author style applies.
         Moving these above the script is safe — the shim reads
         document.currentScript.src (unaffected by a preceding meta or style) and
         only needs to run before anything touches SharedArrayBuffer, which a
         stylesheet does not. Do not reorder without re-running the screencast.
         The literals are unavoidable pre-CSS: #09090B equals --surface-0 (the
         v5 monochrome frame, THEME-V5.md) and the mark's #FAFAFA below equals
         --text-1; keep them in sync with docs/design/tokens.css. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: #09090b;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #09090b;
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot > svg {
          animation: boot-in 240ms cubic-bezier(0.2, 0, 0.2, 1) both;
        }
        @keyframes boot-in {
          from {
            opacity: 0;
          }
        }
      }
    </style>
    <!-- MUST be the first SCRIPT, plain and synchronous, and MUST live in public/.
         coi-serviceworker reads document.currentScript.src to register itself, so
         async / defer / type=module / bundling all break it, and it has to run
         before anything touches SharedArrayBuffer. It gives the page
         COOP: same-origin + COEP on a static host that sends no headers of its own,
         which is what makes crossOriginIsolated true — both engines need it.
         Costs one automatic reload on a first visit. Vendored v0.1.7 plus a Warsha
         offline caching layer (it also precaches the app shell and caches the
         downloaded runtimes so the installed PWA works offline; see
         app/ARCHITECTURE.md §2.5). See runtimes/python/INTEGRATION.md §3. -->
    <script src="./coi-serviceworker.js"></script>
    <!-- /ar/ and /en/ are crawler entry points, not app routes: read the prefix,
         then take it off the URL. Every runtime asset is `new URL(name,
         document.baseURI)`, and under a prefix that base is one directory too
         deep — the JVM, .NET and clang workers all 404. Inline because
         src/runtime/index.ts bakes its worker URLs at import time, before any
         module body runs; sessionStorage because coi-serviceworker reloads once
         on a first visit. See app/ARCHITECTURE.md §7. -->
    <script>
      ;(function () {
        try {
          var here = location.pathname.match(/^(.*\/)(ar|en)\/?$/)
          if (!here) return
          sessionStorage.setItem('warsha:entry-locale', here[2])
          history.replaceState(history.state, '', here[1] + location.search + location.hash)
        } catch (e) {
          // Blocked storage must not stop the boot — locale.ts falls back to the path.
        }
      })()
    </script>
    <!-- No user-scalable=no / maximum-scale: that fails WCAG 1.4.4 and stops a
         student pinching into a stack trace. Double-tap zoom is killed per
         control with touch-action instead. See DESIGN-SPEC §4.2. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches --surface-0 and the manifest's theme_color. Keep all three in
         step; a theme-color that disagrees with the painted background shows up
         as a seam under the status bar on Android. -->
    <meta name="theme-color" content="#09090B" />

    <!-- ONE webfont ships: Readex Pro, for the UI only. DESIGN-SPEC §3.1 said
         none, on the grounds that a 40 MB runtime download is already the
         budget and system-ui is free — still true, and still the fallback. What
         changed is Arabic: system-ui resolves to a different Arabic face on
         every platform, none of them metric-matched to the Latin beside it, so
         a bilingual UI came out three different sizes on three devices. The
         @font-face block in src/index.css carries the full reasoning and the
         byte budget (31 KB Latin, +23 KB Arabic, fetched per unicode-range).
         `ui-monospace` is untouched — the editor and console still cost nothing.

         Preloaded because it is the very first thing painted and `swap` would
         otherwise show one frame of fallback. Only the Latin subset: it is the
         one every visit needs, and the Arabic subset is fetched (and precached
         by the service worker) alongside it without blocking anything. -->
    <link
      rel="preload"
      href="./fonts/readex-pro-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Warsha — Java &amp; Python IDE in your browser</title>
    <meta
      name="description"
      content="Warsha is a free, open-source IDE that runs Java and Python entirely in your browser — no install, no account. It works on a phone, and your files stay on your device."
    />

    <!-- __WARSHA_ORIGIN__ is substituted at build time (and in dev) by the
         warsha:site-origin plugin in vite.config.ts — default
         https://warsha.sb.sa, override with the WARSHA_ORIGIN env var. Do not
         write a literal origin here again: this file used to carry a
         placeholder behind a "replace me" comment, nobody replaced it, and
         every link preview was blank for as long as that was live.
         These four MUST stay absolute — scrapers do not resolve relative image
         URLs, so a relative one is simply no card at all. -->
    <link rel="canonical" href="__WARSHA_ORIGIN__/" />

    <!-- The three indexable URLs. `/` resolves the language itself, from the
         student's browser, so it is x-default; /en/ and /ar/ are prerendered
         copies of THIS file with their own lang/dir, title and description
         (generated by warsha:locale-entries in vite.config.ts — see
         ARCHITECTURE §7). They boot the same app from the same bundle; the path
         prefix is what src/i18n/locale.ts reads to pick the language.
         This block is deliberately identical on all three pages, including each
         page's link to itself: hreflang is only honoured when it is reciprocal,
         and a page missing its own entry is dropped from the set. -->
    <link rel="alternate" hreflang="x-default" href="__WARSHA_ORIGIN__/" />
    <link rel="alternate" hreflang="en" href="__WARSHA_ORIGIN__/en/" />
    <link rel="alternate" hreflang="ar" href="__WARSHA_ORIGIN__/ar/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warsha" />
    <!-- The interface ships in both languages (src/i18n), but both are served
         from this one URL and chosen client-side, so there is no per-locale URL
         to point an hreflang pair at yet. og:locale:alternate is the honest
         signal available today: it tells a scraper the page has an Arabic face
         without claiming a second address that would 404. Real Arabic indexing
         needs separate prerendered entry points. -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:url" content="__WARSHA_ORIGIN__/" />
    <meta property="og:title" content="Warsha — Java &amp; Python IDE in your browser" />
    <meta
      property="og:description"
      content="Write and run Java or Python in your browser. No install, no account — it works on the phone you already have."
    />
    <!-- Dimensions must match the file. Every card is emitted by
         tools/brand/build-brand-assets.mjs at exactly 1200x630; if you change
         the canvas there, change these. There is now one card per locale
         (og-image.png, og-image-ar.png — rendered from the matching
         docs/design/og-image*.html) and /ar/ swaps the image but NOT these two
         numbers, so the build asserts every card really is this size rather
         than trusting the comment. -->
    <meta property="og:image" content="__WARSHA_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Warsha on a tablet and a phone: the tablet runs the Java starter with its file tree and console output, the phone runs the Python starter."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warsha — Java &amp; Python IDE in your browser" />
    <meta
      name="twitter:description"
      content="Write and run Java or Python in your browser. No install, no account — it works on the phone you already have."
    />
    <meta name="twitter:image" content="__WARSHA_ORIGIN__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Warsha on a tablet and a phone: the tablet runs the Java starter with its file tree and console output, the phone runs the Python starter."
    />

    <!-- Structured data. This is the only machine-readable description of what
         Warsha *is* that a crawler can read without executing anything, and it
         is what earns the "free / web-based" treatment in a rich result.
         `offers` at price 0 and `isAccessibleForFree` say the same thing to two
         different consumers; both are cheap and Google reads whichever it
         prefers. Keep `name`/`description` in step with the <title> and
         <meta name=description> above — a schema that disagrees with the page
         it describes is worse than no schema.
         Note the rendered DOM has nothing to add to this: the app shell is an
         IDE chrome ("Run", "New file", "Console"), so JSON-LD, the <title> and
         the description are the entire indexable surface of this URL today. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Warsha",
        "url": "__WARSHA_ORIGIN__/",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Integrated Development Environment",
        "operatingSystem": "Any — runs in a web browser",
        "browserRequirements": "Requires WebAssembly and SharedArrayBuffer",
        "description": "Warsha is a free, open-source IDE that runs Java and Python entirely in your browser — no install, no account. It works on a phone, and your files stay on your device.",
        "inLanguage": ["en", "ar"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "codeRepository": "https://github.com/Saad5400/warsha",
        "image": "__WARSHA_ORIGIN__/og-image.png",
        "screenshot": "__WARSHA_ORIGIN__/og-image.png"
      }
    </script>

    <!-- sizes="any" on the .ico is what tells a browser that understands SVG to
         prefer the SVG and skip the raster entirely. The .ico still earns its
         place: tooling that hard-fetches /favicon.ico used to take a standing
         404 in the console.
         All of these are generated from docs/design/mark.svg — see
         DESIGN-SPEC §11 and tools/brand/build-brand-assets.mjs. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  <!-- Analytics (self-hosted Umami, cookieless). `crossorigin` is load-bearing:
       under COEP require-corp a cross-origin script needs CORP or CORS, and Umami
       sends `Access-Control-Allow-Origin: *` (no CORP), so it must load via CORS. -->
  <script defer crossorigin="anonymous" src="https://analytics.sb.sa/script.js" data-website-id="e59f0211-4dc2-41a5-8448-e907af1b000a"></script>
  </head>
  <body>
    <!-- COLD-LOAD SPLASH. Self-contained, dependency-free, and first in <body> so
         the browser paints it on frame one — before /src/main.tsx is even fetched,
         let alone hydrated. It is a full-screen fixed overlay at the top of the
         stacking context that plays Warsha's core loop (code → compile → binary →
         scatter → console output) on its own requestAnimationFrame loop, entirely
         independent of the React bundle. The app calls window.__appReady() after it
         has mounted and painted (see src/main.tsx); the splash then finishes its
         current scene, fades via a CSS opacity transition, and removes itself. A
         ~15s failsafe force-dismisses it so it can never strand the app behind it.
         Dark-only to match the fixed `color-scheme: dark` shell above; honours
         prefers-reduced-motion with a static mark and no rAF loop.
         Literal colours are the v5 monochrome tokens (docs/design/tokens.css):
         #09090B --surface-0, #FAFAFA --text-1/--accent, #6BD68F --success. -->
    <style>
      #warsha-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #09090b;
        opacity: 1;
        transition: opacity 480ms cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      #warsha-splash.warsha-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      #warsha-splash-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
      }
      /* Base layer: shows for the one frame before the canvas draws, and is the
         entire splash when the animation is suppressed. */
      #warsha-splash-static {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
      }
      @media (prefers-reduced-motion: no-preference) {
        #warsha-splash-static > svg {
          animation: warsha-splash-in 240ms cubic-bezier(0.2, 0, 0.2, 1) both;
        }
        @keyframes warsha-splash-in {
          from {
            opacity: 0;
          }
        }
      }
      /* Static fallback: no canvas animation, just the mark on the dark frame. */
      @media (prefers-reduced-motion: reduce) {
        #warsha-splash-canvas {
          display: none;
        }
      }
    </style>
    <div id="warsha-splash" role="presentation" aria-hidden="true">
      <canvas id="warsha-splash-canvas" aria-hidden="true"></canvas>
      <div id="warsha-splash-static" aria-hidden="true">
        <!-- The mark, same geometry as #boot / components/Logo.tsx. -->
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6.75 4.275 3.15 4.275 3.15 19.725 6.75 19.725"
            stroke="#FAFAFA"
            stroke-width="3.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M17.25 4.275 20.85 4.275 20.85 19.725 17.25 19.725"
            stroke="#FAFAFA"
            stroke-width="3.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="9.6" y="7.65" width="4.8" height="8.7" rx="2.4" fill="#FAFAFA" />
        </svg>
      </div>
    </div>
    <script>
      /* Warsha cold-start splash — the product's core loop as one continuous shot,
         ported from the design-doc composition (Warsha Splash.dc.html) to a plain
         canvas + rAF IIFE with no imports, no framework, no external assets.
         Everything is a pure function of a looping clock T (0..6.5s): code types
         out, the vise jaws clamp, each line compiles to binary, every bit scatters
         and turns green, then the green bits gather block-by-block into a printed
         console line and a success bar — and it seams back to the caret. */
      ;(function () {
        var host = document.getElementById('warsha-splash')
        var canvas = document.getElementById('warsha-splash-canvas')
        if (!host || !canvas) return
        var ctx = canvas.getContext('2d')
        var reduce =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

        // Play the full animation on a first visit only; on return visits dismiss as
        // soon as the app is ready. localStorage so it persists across sessions — and
        // because the flag is only set once the splash actually begins dismissing, a
        // genuine first visit (which coi-serviceworker reloads once, before the app
        // boots) still plays in full on the post-reload load. Blocked storage falls
        // back to treating the load as a first visit — the safe, more-generous default.
        var SEEN_KEY = 'warsha:splash-seen'
        var firstVisit = true
        try { firstVisit = !localStorage.getItem(SEEN_KEY) } catch (e) {}
        var markSeen = function () { try { localStorage.setItem(SEEN_KEY, '1') } catch (e) {} }

        /* ---- palette (v5 monochrome tokens) ---- */
        var C = {
          frame: '#09090B', canvas: '#0E0E11', panel: '#151519', border: '#242429',
          tok: '#4F4F59', tok2: '#6A6A7C', text2: '#BABAC4', success: '#6BD68F',
        }
        var accent = '#FAFAFA'
        var AC = function (c) { return c === 'accent' ? accent : c }

        /* ---- easing (all motion lives here) ---- */
        var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v }
        var frac = function (T, a, b) { return clamp((T - a) / (b - a), 0, 1) }
        var lerp = function (a, b, u) { return a + (b - a) * u }
        var easeOutCubic = function (x) { return 1 - Math.pow(1 - x, 3) }
        var easeInOutQuad = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2 }
        var c1 = 1.70158, c3 = c1 + 1
        var easeOutBack = function (x) { return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
        var enter = function (T, a, b) { return easeOutCubic(frac(T, a, b)) }
        var travel = function (T, a, b) { return easeInOutQuad(frac(T, a, b)) }
        var pop = function (T, a, b) { return easeOutBack(frac(T, a, b)) }
        var rnd = function (n) { var s = Math.sin(n) * 43758.5453; return s - Math.floor(s) }

        /* ---- world layout (1920x1080) — three lines of code ---- */
        var START_X = 734, GAP = 18
        var LINES_Y = [402, 470, 538]
        var RAW = [[122, 46, 156, 60, 110, 44], [96, 60, 214, 72], [122, 46, 132, 60, 122, 44]]
        var LINES = RAW.map(function (ws) {
          var x = START_X
          return ws.map(function (w, i) {
            var t = { x: x, w: w, c: i === 0 ? 'accent' : i % 2 ? C.tok : C.tok2 }
            x += w + GAP
            return t
          })
        })
        var lineEnd = function (li) { var l = LINES[li]; var t = l[l.length - 1]; return t.x + t.w }

        /* ---- printed console output line ---- */
        var OUT_Y = 726, PROMPT_X = 676, OUT_X0 = 708
        var OUT_RAW = [90, 128, 58, 150, 92, 112]
        var OUT = (function () {
          var x = OUT_X0
          return OUT_RAW.map(function (w, i) {
            var t = { x: x, w: w, c: i === 0 ? 'accent' : [C.tok2, C.tok, C.tok2, C.tok, C.tok2][i % 5] }
            x += w + 15
            return t
          })
        })()
        var OUT_END = OUT[OUT.length - 1].x + OUT[OUT.length - 1].w
        var OUTN = OUT.length
        var EMIT0 = 3.95, ESTEP = 0.27
        var emitAt = function (g) { return EMIT0 + g * ESTEP }

        /* ---- binary digits — each an individual particle, assigned to an output block ---- */
        var B_X0 = 736, B_N = 46, B_ADV = (1404 - B_X0) / (B_N - 1)
        var BITS = []
        LINES_Y.forEach(function (_, r) {
          for (var i = 0; i < B_N; i++) {
            var gid = r * 100 + i
            BITS.push({
              r: r, i: i, gid: gid, x: B_X0 + i * B_ADV, colFrac: i / (B_N - 1),
              bit: Math.floor(Math.abs(Math.sin((i + 1) * (r + 1.3) * 12.9898)) * 1e4) % 2,
              sx: 616 + rnd(gid * 1.7 + 0.5) * 828,
              sy: 352 + rnd(gid * 3.1 + 2.0) * 436,
              sj: rnd(gid * 5.3) * 0.22,
              g: Math.floor(rnd(gid * 7.71) * OUTN),
            })
          }
        })

        /* ---- camera: one interpolated path across the whole timeline ---- */
        var CAM = [
          { t: 0.0, fx: 806, fy: 402, s: 1.52 },
          { t: 1.7, fx: 1010, fy: 470, s: 1.05 },
          { t: 2.4, fx: 1044, fy: 470, s: 1.12 },
          { t: 3.45, fx: 1020, fy: 560, s: 0.8 },
          { t: 4.35, fx: 860, fy: 726, s: 1.14 },
          { t: 5.35, fx: 1180, fy: 720, s: 0.98 },
          { t: 5.95, fx: 1080, fy: 720, s: 1.05 },
          { t: 6.5, fx: 806, fy: 402, s: 1.52 },
        ]
        var camAt = function (T) {
          var k = 0
          while (k < CAM.length - 1 && T > CAM[k + 1].t) k++
          var a = CAM[k], b = CAM[Math.min(k + 1, CAM.length - 1)]
          var u = a === b ? 0 : travel(T, a.t, b.t)
          return { fx: lerp(a.fx, b.fx, u), fy: lerp(a.fy, b.fy, u), s: lerp(a.s, b.s, u) }
        }

        var blink = function (T) { return 0.55 + 0.45 * Math.cos((2 * Math.PI * T) / 0.6) }
        var WRITE = [[0.06, 0.62, 0], [0.66, 1.12, 1], [1.16, 1.62, 2]]
        var LOOP = 6.5
        // The finished frame: output printed, success bar full, before any teardown
        // or caret-return. This is where the animation "lands" — the splash settles
        // and fades here rather than at the loop seam, and the loop lingers here for
        // HOLD seconds so it breathes instead of snapping straight back to the caret.
        var FINALE = 6.15, HOLD = 0.8, PERIOD = LOOP + HOLD
        // Map a period-phase (0..PERIOD) to an animation time T, freezing at FINALE
        // for the hold so the finished frame lingers before the teardown resumes.
        var timeAt = function (p) { return p < FINALE ? p : p < FINALE + HOLD ? FINALE : p - HOLD }

        /* ---- a rounded-rect path with independent corner radii ---- */
        var path = function (x, y, w, h, tl, tr, br, bl) {
          ctx.beginPath()
          ctx.moveTo(x + tl, y)
          ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr)
          ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br)
          ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl)
          ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl)
          ctx.closePath()
        }
        var fillRR = function (x, y, w, h, r, color, alpha) {
          if (alpha <= 0.002 || w <= 0) return
          ctx.globalAlpha = alpha
          ctx.fillStyle = color
          path(x, y, w, h, r, r, r, r)
          ctx.fill()
          ctx.globalAlpha = 1
        }

        var dpr = 1, VW = 0, VH = 0
        var resize = function () {
          dpr = Math.min(window.devicePixelRatio || 1, 2)
          VW = host.clientWidth || window.innerWidth
          VH = host.clientHeight || window.innerHeight
          canvas.width = Math.round(VW * dpr)
          canvas.height = Math.round(VH * dpr)
        }

        function draw(T) {
          // clear the whole backing store to the frame colour
          ctx.setTransform(1, 0, 0, 1, 0, 0)
          ctx.fillStyle = C.frame
          ctx.fillRect(0, 0, canvas.width, canvas.height)

          // stage->screen composed with the camera; focal point sits at screen centre.
          // Fill the viewport (cover) on landscape, where the wide 16:9 shot fits its
          // aspect; but on a viewport taller/narrower than 16:9, cover would blow the
          // content up until the sides (code lines, vise jaws) fall off the screen. Cap
          // the scale at 1.4x the width-fit there, so a phone scales the whole shot down
          // to fit its width and the centred action always stays on screen.
          var cam = camAt(T)
          var fitW = VW / 1920, fitH = VH / 1080
          var fit = Math.min(Math.max(fitW, fitH), fitW * 1.4)
          var s = fit * cam.s
          ctx.setTransform(
            dpr * s, 0, 0, dpr * s,
            dpr * (VW / 2 - s * cam.fx), dpr * (VH / 2 - s * cam.fy)
          )

          // ---- editor pane (grounds the shot in Warsha's own UI) ----
          ctx.globalAlpha = 1
          path(540, 300, 1000, 560, 18, 18, 18, 18); ctx.fillStyle = C.canvas; ctx.fill()
          ctx.lineWidth = 1; ctx.strokeStyle = C.border; ctx.stroke()
          path(540, 300, 58, 560, 18, 0, 0, 18); ctx.fillStyle = C.panel; ctx.fill()
          ctx.beginPath(); ctx.moveTo(598, 300); ctx.lineTo(598, 860); ctx.strokeStyle = C.border; ctx.stroke()

          // ---- source token-blocks, three lines ----
          var srcExit = travel(T, 2.2, 2.7)
          LINES.forEach(function (line, li) {
            line.forEach(function (t, i) {
              var born = WRITE[li][0] + (i / line.length) * (WRITE[li][1] - WRITE[li][0])
              var op = enter(T, born, born + 0.14) * (1 - srcExit)
              fillRR(t.x, LINES_Y[li] - 15, t.w, 30, 6, AC(t.c), op)
            })
          })

          // ---- binary: compile in place, scatter (green), then gather to the output block ----
          ctx.font = '600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          BITS.forEach(function (d) {
            var on = 2.2 + d.colFrac * 0.5 + d.r * 0.06
            var appear = enter(T, on, on + 0.12)
            if (appear <= 0.002) return
            var eg = emitAt(d.g)
            var fade = enter(T, eg + 0.24, eg + 0.55)
            var opv = appear * (1 - fade)
            if (opv <= 0.004) return
            var su = enter(T, 3.0 + d.sj, 3.9 + d.sj)
            var cu = enter(T, eg, eg + 0.46)
            var slot = OUT[d.g]
            var tx = slot.x + slot.w / 2 - 6.5
            var x = lerp(lerp(d.x, d.sx, su), tx, cu)
            var y = lerp(lerp(LINES_Y[d.r], d.sy, su), OUT_Y, cu)
            var sc = lerp(1, 0.45, cu)
            var settleAt = on + 0.2
            var ch = T < settleAt ? String((Math.floor(T * 26) + d.i + d.r) % 2) : String(d.bit)
            var color = T >= 2.98 ? C.success : d.i % 6 === 0 ? accent : C.text2
            ctx.save()
            ctx.globalAlpha = opv
            ctx.fillStyle = color
            ctx.translate(x + 6.5, y)
            ctx.scale(sc, sc)
            ctx.fillText(ch, 0, 0)
            ctx.restore()
          })

          // ---- vise jaws (Warsha's bracket mark) clamping the code block ----
          var jSeat = pop(T, 1.66, 2.1)
          var jRelease = travel(T, 2.9, 3.35)
          var leftX = lerp(lerp(614, 692, jSeat), 600, jRelease)
          var rightX = lerp(lerp(1524, 1444, jSeat), 1536, jRelease)
          var jawOp = enter(T, 1.66, 1.95) * (1 - enter(T, 2.95, 3.45))
          if (jawOp > 0.001) {
            var jawH = 208, barW = 10, ret = 34, cy = LINES_Y[1]
            ctx.globalAlpha = jawOp
            ctx.fillStyle = accent
            var jaw = function (x, dir) {
              path(x, cy - jawH / 2, barW, jawH, 4, 4, 4, 4); ctx.fill()
              var rx = dir > 0 ? x : x - ret + barW
              path(rx, cy - jawH / 2, ret, barW, 4, 4, 4, 4); ctx.fill()
              path(rx, cy + jawH / 2 - barW, ret, barW, 4, 4, 4, 4); ctx.fill()
            }
            jaw(leftX, 1); jaw(rightX, -1)
            ctx.globalAlpha = 1
          }

          // ---- console row + the printed output line (one block per bit-cluster) ----
          var rowFade = 1 - enter(T, 6.2, 6.48)
          var greenBase = enter(T, 5.75, 6.15)
          var rowOn = enter(T, 3.9, 4.3) * rowFade
          if (rowOn > 0.004) {
            fillRR(PROMPT_X - 28, OUT_Y - 33, OUT_END - PROMPT_X + 64, 66, 10, C.panel, 0.4 * rowOn)
            fillRR(PROMPT_X, OUT_Y - 13, 5, 26, 2, accent, enter(T, 3.95, 4.25) * rowFade)
            OUT.forEach(function (t, i) {
              var eg = emitAt(i)
              var bu = pop(T, eg + 0.26, eg + 0.62)
              var op = bu * rowFade
              if (op <= 0.004) return
              var flash = clamp(1 - enter(T, eg + 0.28, eg + 0.78), 0, 1)
              var sc = 0.72 + 0.28 * bu
              var cx = t.x + t.w / 2, cyy = OUT_Y
              ctx.save()
              ctx.globalAlpha = op
              if (flash > 0.02) {
                ctx.shadowColor = 'rgba(107,214,143,' + (flash * 0.47).toFixed(3) + ')'
                ctx.shadowBlur = 14 * flash
              }
              ctx.translate(cx, cyy); ctx.scale(sc, sc); ctx.translate(-cx, -cyy)
              ctx.fillStyle = AC(t.c)
              path(t.x, OUT_Y - 15, t.w, 30, 7, 7, 7, 7); ctx.fill()
              ctx.restore()
            })
            fillRR(OUT_X0, OUT_Y + 27, (OUT_END - OUT_X0) * greenBase, 6, 3, C.success, rowFade)
          }

          // ---- caret: types line by line, gone in the middle, returns for the seam ----
          var caretX, caretY
          if (T >= 6.1) { caretX = START_X; caretY = LINES_Y[0] }
          else if (T < 1.66) {
            var seg = null
            for (var w = 0; w < WRITE.length; w++) { if (T <= WRITE[w][1]) { seg = WRITE[w]; break } }
            if (!seg) seg = WRITE[2]
            caretX = lerp(START_X, lineEnd(seg[2]), clamp((T - seg[0]) / (seg[1] - seg[0]), 0, 1))
            caretY = LINES_Y[seg[2]]
          } else { caretX = lineEnd(2); caretY = LINES_Y[2] }
          var writeGate = 1 - enter(T, 1.66, 1.86)
          var tail = enter(T, 6.15, 6.5)
          var caretOp = clamp(Math.max(blink(T) * writeGate, tail), 0, 1)
          fillRR(caretX, caretY - 24, 4, 48, 2, accent, caretOp)
        }

        /* ---- lifecycle: rAF loop, ready handshake, fade-out, failsafe ---- */
        var raf = 0, startTs = null, elapsed = 0, dismissing = false, fadeAt = null
        var frozenT = null // animation time held (frozen) under the fade — no restart shows through
        // Absolute time of the next finale (the landed, finished frame) at/after `from`.
        var nextFinale = function (from) {
          var k = Math.floor(from / PERIOD)
          var cand = k * PERIOD + FINALE
          if (cand < from) cand += PERIOD
          return cand
        }

        var cleanup = function () {
          if (raf) cancelAnimationFrame(raf)
          if (failsafe) clearTimeout(failsafe)
          if (host && host.parentNode) host.parentNode.removeChild(host)
          try { delete window.__appReady } catch (e) { window.__appReady = undefined }
        }
        // Freeze the frame we fade from so the loop never visibly restarts underneath the
        // fade: holdAt = FINALE for a settled first-visit exit, or the current frame for
        // an immediate dismiss.
        var beginFade = function (holdAt) {
          if (dismissing) return
          dismissing = true
          frozenT = holdAt != null ? holdAt : timeAt(elapsed % PERIOD)
          markSeen() // this visit has now seen the splash; future visits fast-dismiss
          host.classList.add('warsha-splash--done')
          var done = false
          var finish = function () { if (done) return; done = true; cleanup() }
          host.addEventListener('transitionend', finish)
          setTimeout(finish, 700) // fallback if transitionend never fires
        }
        // force (failsafe) or reduced-motion dismiss immediately. A return visitor
        // dismisses as soon as the app is ready. A first-time visitor holds until the
        // animation lands on its finished frame — playing at least one full cycle — and
        // fades from that settled frame rather than from a fresh loop's opening.
        var requestDismiss = function (force) {
          if (dismissing) return
          if (force || reduce || !firstVisit) { beginFade(); return }
          if (fadeAt === null) fadeAt = nextFinale(elapsed)
        }

        var frame = function (ts) {
          if (startTs === null) startTs = ts
          elapsed = (ts - startTs) / 1000
          if (fadeAt !== null && !dismissing && elapsed >= fadeAt) beginFade(FINALE)
          draw(dismissing ? frozenT : timeAt(elapsed % PERIOD))
          raf = requestAnimationFrame(frame)
        }

        // The app signals it has mounted and painted real content (see src/main.tsx).
        window.__appReady = function () { requestDismiss(false) }
        // Failsafe: never let the splash cover the app forever.
        var failsafe = setTimeout(function () { requestDismiss(true) }, 15000)

        if (reduce) {
          // Static fallback: the mark stays, no animation loop runs.
          return
        }
        resize()
        window.addEventListener('resize', resize)
        raf = requestAnimationFrame(frame)
      })()
    </script>
