<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIRST PAINT. These four lines come before the service-worker script on
         purpose, and the order is load-bearing.
         coi-serviceworker is a synchronous, parser-blocking script, so anything
         after it is not parsed until it has been fetched and executed — which is
         long enough for Chrome to composite one white frame. Measured on a real
         first visit (CDP screencast, fresh profile, 390x844): with the style tag
         placed after the script, frame 1 at 18ms was still rgb(255,255,255).
         `color-scheme: dark` is the part that actually fixes it: it tells the UA
         to paint its own default canvas dark before any author style applies.
         Moving these above the script is safe — the shim reads
         document.currentScript.src (unaffected by a preceding meta or style) and
         only needs to run before anything touches SharedArrayBuffer, which a
         stylesheet does not. Do not reorder without re-running the screencast.
         The literals are unavoidable pre-CSS: #09090B equals --surface-0 (the
         v5 monochrome frame, THEME-V5.md) and the mark's #FAFAFA below equals
         --text-1; keep them in sync with docs/design/tokens.css. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: #09090b;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #09090b;
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot > svg {
          animation: boot-in 240ms cubic-bezier(0.2, 0, 0.2, 1) both;
        }
        @keyframes boot-in {
          from {
            opacity: 0;
          }
        }
      }
    </style>
    <!-- MUST be the first SCRIPT, plain and synchronous, and MUST live in public/.
         coi-serviceworker reads document.currentScript.src to register itself, so
         async / defer / type=module / bundling all break it, and it has to run
         before anything touches SharedArrayBuffer. It gives the page
         COOP: same-origin + COEP on a static host that sends no headers of its own,
         which is what makes crossOriginIsolated true — both engines need it.
         Costs one automatic reload on a first visit. Vendored v0.1.7 plus a Warsha
         offline caching layer (it also precaches the app shell and caches the
         downloaded runtimes so the installed PWA works offline; see
         app/ARCHITECTURE.md §2.5). See runtimes/python/INTEGRATION.md §3. -->
    <script src="./coi-serviceworker.js"></script>
    <!-- /ar/ and /en/ are crawler entry points, not app routes: read the prefix,
         then take it off the URL. Every runtime asset is `new URL(name,
         document.baseURI)`, and under a prefix that base is one directory too
         deep — the JVM, .NET and clang workers all 404. Inline because
         src/runtime/index.ts bakes its worker URLs at import time, before any
         module body runs; sessionStorage because coi-serviceworker reloads once
         on a first visit. See app/ARCHITECTURE.md §7. -->
    <script>
      ;(function () {
        try {
          var here = location.pathname.match(/^(.*\/)(ar|en)\/?$/)
          if (!here) return
          sessionStorage.setItem('warsha:entry-locale', here[2])
          history.replaceState(history.state, '', here[1] + location.search + location.hash)
        } catch (e) {
          // Blocked storage must not stop the boot — locale.ts falls back to the path.
        }
      })()
    </script>
    <!-- No user-scalable=no / maximum-scale: that fails WCAG 1.4.4 and stops a
         student pinching into a stack trace. Double-tap zoom is killed per
         control with touch-action instead. See DESIGN-SPEC §4.2. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches --surface-0 and the manifest's theme_color. Keep all three in
         step; a theme-color that disagrees with the painted background shows up
         as a seam under the status bar on Android. -->
    <meta name="theme-color" content="#09090B" />

    <!-- ONE webfont ships: Readex Pro, for the UI only. DESIGN-SPEC §3.1 said
         none, on the grounds that a 40 MB runtime download is already the
         budget and system-ui is free — still true, and still the fallback. What
         changed is Arabic: system-ui resolves to a different Arabic face on
         every platform, none of them metric-matched to the Latin beside it, so
         a bilingual UI came out three different sizes on three devices. The
         @font-face block in src/index.css carries the full reasoning and the
         byte budget (31 KB Latin, +23 KB Arabic, fetched per unicode-range).
         `ui-monospace` is untouched — the editor and console still cost nothing.

         Preloaded because it is the very first thing painted and `swap` would
         otherwise show one frame of fallback. Only the Latin subset: it is the
         one every visit needs, and the Arabic subset is fetched (and precached
         by the service worker) alongside it without blocking anything. -->
    <link
      rel="preload"
      href="./fonts/readex-pro-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Warsha — Java &amp; Python IDE in your browser</title>
    <meta
      name="description"
      content="Warsha is a free, open-source IDE that runs Java and Python entirely in your browser — no install, no account. It works on a phone, and your files stay on your device."
    />

    <!-- __WARSHA_ORIGIN__ is substituted at build time (and in dev) by the
         warsha:site-origin plugin in vite.config.ts — default
         https://warsha.sb.sa, override with the WARSHA_ORIGIN env var. Do not
         write a literal origin here again: this file used to carry a
         placeholder behind a "replace me" comment, nobody replaced it, and
         every link preview was blank for as long as that was live.
         These four MUST stay absolute — scrapers do not resolve relative image
         URLs, so a relative one is simply no card at all. -->
    <link rel="canonical" href="__WARSHA_ORIGIN__/" />

    <!-- The three indexable URLs. `/` resolves the language itself, from the
         student's browser, so it is x-default; /en/ and /ar/ are prerendered
         copies of THIS file with their own lang/dir, title and description
         (generated by warsha:locale-entries in vite.config.ts — see
         ARCHITECTURE §7). They boot the same app from the same bundle; the path
         prefix is what src/i18n/locale.ts reads to pick the language.
         This block is deliberately identical on all three pages, including each
         page's link to itself: hreflang is only honoured when it is reciprocal,
         and a page missing its own entry is dropped from the set. -->
    <link rel="alternate" hreflang="x-default" href="__WARSHA_ORIGIN__/" />
    <link rel="alternate" hreflang="en" href="__WARSHA_ORIGIN__/en/" />
    <link rel="alternate" hreflang="ar" href="__WARSHA_ORIGIN__/ar/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warsha" />
    <!-- The interface ships in both languages (src/i18n), but both are served
         from this one URL and chosen client-side, so there is no per-locale URL
         to point an hreflang pair at yet. og:locale:alternate is the honest
         signal available today: it tells a scraper the page has an Arabic face
         without claiming a second address that would 404. Real Arabic indexing
         needs separate prerendered entry points. -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:url" content="__WARSHA_ORIGIN__/" />
    <meta property="og:title" content="Warsha — Java &amp; Python IDE in your browser" />
    <meta
      property="og:description"
      content="Write and run Java or Python in your browser. No install, no account — it works on the phone you already have."
    />
    <!-- Dimensions must match the file. Every card is emitted by
         tools/brand/build-brand-assets.mjs at exactly 1200x630; if you change
         the canvas there, change these. There is now one card per locale
         (og-image.png, og-image-ar.png — rendered from the matching
         docs/design/og-image*.html) and /ar/ swaps the image but NOT these two
         numbers, so the build asserts every card really is this size rather
         than trusting the comment. -->
    <meta property="og:image" content="__WARSHA_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Warsha on a tablet and a phone: the tablet runs the Java starter with its file tree and console output, the phone runs the Python starter."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warsha — Java &amp; Python IDE in your browser" />
    <meta
      name="twitter:description"
      content="Write and run Java or Python in your browser. No install, no account — it works on the phone you already have."
    />
    <meta name="twitter:image" content="__WARSHA_ORIGIN__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Warsha on a tablet and a phone: the tablet runs the Java starter with its file tree and console output, the phone runs the Python starter."
    />

    <!-- Structured data. This is the only machine-readable description of what
         Warsha *is* that a crawler can read without executing anything, and it
         is what earns the "free / web-based" treatment in a rich result.
         `offers` at price 0 and `isAccessibleForFree` say the same thing to two
         different consumers; both are cheap and Google reads whichever it
         prefers. Keep `name`/`description` in step with the <title> and
         <meta name=description> above — a schema that disagrees with the page
         it describes is worse than no schema.
         Note the rendered DOM has nothing to add to this: the app shell is an
         IDE chrome ("Run", "New file", "Console"), so JSON-LD, the <title> and
         the description are the entire indexable surface of this URL today. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Warsha",
        "url": "__WARSHA_ORIGIN__/",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Integrated Development Environment",
        "operatingSystem": "Any — runs in a web browser",
        "browserRequirements": "Requires WebAssembly and SharedArrayBuffer",
        "description": "Warsha is a free, open-source IDE that runs Java and Python entirely in your browser — no install, no account. It works on a phone, and your files stay on your device.",
        "inLanguage": ["en", "ar"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "codeRepository": "https://github.com/Saad5400/warsha",
        "image": "__WARSHA_ORIGIN__/og-image.png",
        "screenshot": "__WARSHA_ORIGIN__/og-image.png"
      }
    </script>

    <!-- sizes="any" on the .ico is what tells a browser that understands SVG to
         prefer the SVG and skip the raster entirely. The .ico still earns its
         place: tooling that hard-fetches /favicon.ico used to take a standing
         404 in the console.
         All of these are generated from docs/design/mark.svg — see
         DESIGN-SPEC §11 and tools/brand/build-brand-assets.mjs. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  <!-- Analytics (self-hosted Umami, cookieless) -->
  <script defer src="https://analytics.sb.sa/script.js" data-website-id="e59f0211-4dc2-41a5-8448-e907af1b000a"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <!-- The mark, geometry copied from docs/design/logo.svg (brand v3's
             clean-silhouette tier — this renders at 40px, well under the
             ~180px floor where the founder's actual glitch texture stays
             legible; see the note atop docs/design/mark.svg). Literal colours
             because this paints before any stylesheet; #FAFAFA equals
             --text-1 in docs/design/tokens.css (v5 monochrome — see
             THEME-V5.md), on the #09090B / --surface-0 boot background above.
             If the mark changes, this and components/Logo.tsx are the two
             hand-maintained copies that will not update themselves. -->
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6.75 4.275 3.15 4.275 3.15 19.725 6.75 19.725"
            stroke="#FAFAFA"
            stroke-width="3.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M17.25 4.275 20.85 4.275 20.85 19.725 17.25 19.725"
            stroke="#FAFAFA"
            stroke-width="3.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="9.6" y="7.65" width="4.8" height="8.7" rx="2.4" fill="#FAFAFA" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
