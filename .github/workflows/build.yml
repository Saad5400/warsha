# Builds the production image exactly as the deploy does (the root Dockerfile),
# so a change that would break the deploy fails here, on the PR, with the full
# build log visible on GitHub -- instead of only in the hosting dashboard.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Plain progress so every step's output (npm, ECJ, javac, dotnet publish,
      # vite) lands in the log, not a collapsed spinner.
      - name: docker build
        run: docker build --progress=plain -t warsha:ci .

  java-bootstrap:
    name: Java bootstrap self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production image has no UTF-8 locale, so JDK 17's javac reads sources
    # as US-ASCII there. Same here, so a stray non-ASCII byte fails in CI too.
    env:
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is what the production image compiles warsha-boot.jar with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch ECJ
        run: runtimes/java/fetch-compiler.sh

      - name: validate.sh
        run: runtimes/java/validate.sh
